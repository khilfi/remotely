[package]
name = "remotely-core"
description = "Core of Remotely: command bus, policy engine, job runner, adapters, vault and store. No Tauri types."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fake adapters (VMware, remote, vault, host counters, updater) and a local SSH server for tests.
# Never enabled in the app.
fakes = ["getrandom/sys_rng", "dep:futures", "dep:blake2"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
hex = "0.4"
regex = "1"
# QL-17: a highlight or alert rule's pattern is checked on its syntax tree (what Rust and JavaScript read alike).
# The version regex already pulls in.
regex-syntax = "0.8"
sha2 = "0.11"
# `local-offset`: local time in session log lines (SS-11) and in FD-07 export file names.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "local-offset"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# SS-04 vault: AES-256-GCM per item and Argon2id for the master password, with keys zeroized on drop.
# The versions russh already pulls in.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# SysRng: the random source for generating SSH keys (SS-09).
getrandom = { version = "0.4", features = ["sys_rng"] }
futures = { version = "0.3", optional = true }
# AP-05: the audit log is verified and exported row by row (sqlx's row streams). The version sqlx already pulls in.
futures-util = { version = "0.3", default-features = false }
zeroize = "1"
# SS-02: session lists imported from CSV.
csv = "1"
# FD-07: the encrypted export file's envelope; FD-14's test signatures. The version the dependencies already
# pull in.
base64 = "0.23"
# SSH (SS-03, BX-02, MO-02). `ring` instead of the default aws-lc-rs so Windows builds need no CMake/NASM.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
# SS-08: SFTP on a channel of the terminal's own SSH connection (client), and the test server's SFTP
# subsystem (server). It only needs a byte stream, so it works with any russh version.
russh-sftp = "3"
# BX-03: the line diff between two output groups.
similar = "3"
# FD-14: the GitHub Releases API of the private repo, with the update token from the vault. The reqwest
# and rustls that tauri-plugin-updater already uses: rustls with ring (no aws-lc-rs, so no CMake/NASM).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = { version = "2", features = ["serde"] }
# FD-14 tests (fakes only): minisign signatures from a throwaway key, made at run time (base64, above, too).
blake2 = { version = "0.11", optional = true }
# FD-14 (C3): checks an update signature's trusted comment against the app's public key before the
# version it names is believed; the fakes sign with it. The version russh already pulls in.
ed25519-dalek = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Host RAM, CPUs and free disk (VM-07, MO-04), each VM process's counters and command line (MO-01),
# this PC's paging files (MO-15),
# DPAPI for the vault key (SS-04) and reverse DNS for a session's host name (QL-03). 0.62 is the version
# Tauri already pulls in.
windows = { version = "0.62", features = [
    # SS-12: serial consoles (COM ports through CreateFileW, SetCommState, SetCommBreak; ReadFile and WriteFile).
    "Win32_Devices_Communication",
    "Win32_System_IO",
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    # SS-07: other users signed in to this PC (WTSEnumerateSessionsW), who share its loopback.
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Try the terminal without a real host (see the file).
[[example]]
name = "dev_ssh_server"
required-features = ["fakes"]

[dev-dependencies]
# Integration tests in tests/ use the fake adapters.
remotely-core = { path = ".", features = ["fakes"] }
tokio = { workspace = true, features = ["test-util"] }
# BX-07: the secret-leak test reads every log line the core and russh write.
tracing-subscriber.workspace = true
