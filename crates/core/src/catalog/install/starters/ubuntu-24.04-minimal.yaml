#cloud-config
# Ubuntu Server 24.04 LTS, minimal: one admin user with sudo and your SSH key, OpenSSH, LVM over the whole disk, DHCP.
# A starter from Remotely: copy it to change it. The admin password, picked from the vault, goes in as a SHA-512
# hash when a VM is deployed. open-vm-tools (VMware Tools) lets Workstation learn the guest's address on a bridged
# network, and on VirtualBox it doesn't start. The ISO doesn't carry it for the minimal source, so it comes from
# Ubuntu's archive when the network reaches it; the late command never fails the install, which works offline as before.
autoinstall:
  version: 1
  source:
    id: ubuntu-server-minimal
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Etc/UTC
  network:
    version: 2
    ethernets:
      any:
        match:
          name: "e*"
        dhcp4: true
  storage:
    layout:
      name: lvm
  identity:
    hostname: "{{hostname}}"
    username: sysadmin
    password: "{{password.admin}}"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "{{ssh_key.admin}}"
  updates: security
  late-commands:
    - "curtin in-target -- sh -c 'timeout 300 apt-get install -y open-vm-tools || true'"
  shutdown: reboot
