[package]
name = "remotely"
description = "Remotely desktop shell (Tauri 2)"
# Release version: keep in step with package.json and tauri.conf.json (see CLAUDE.md).
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "remotely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
remotely-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Zeroes a key file's bytes when they are not text (SS-04).
zeroize = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2"
# FD-14: the GitHub API asset URLs the updater fetches from.
url = "2"
# AP-05: the save dialog for audit exports, opened from Rust so the UI never picks a path itself.
tauri-plugin-dialog = "2"
# QL-05: right-click paste reads the clipboard's text here, so WebView2 never asks for clipboard permission.
arboard = { version = "3", default-features = false }
# QL-07: a Windows notification when a long command in a background tab finishes, shown from Rust.
tauri-plugin-notification = "2"
# QL-15: the daily log file under the app's data folder, the last 7 kept.
tracing-appender = "0.2"
# QL-15: %LOCALAPPDATA%, found the way Tauri finds it, so the log folder is known before the app starts.
# The version Tauri already uses.
dirs = "7"
# QL-15: a second launch brings the running window forward and exits.
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# QL-13: a library entry's manual page opens in the default browser (ShellExecuteW); QL-15: the startup error
# message box; SS-03 (R9): resume and new-address notifications wake terminals waiting to reconnect. The version
# the core and Tauri already use.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# QL-15: turns WebView2's browser keys off in release builds (F5 and Ctrl+R reload, Ctrl+Shift+I). The version
# wry already uses.
webview2-com = "0.39"

[dev-dependencies]
# FD-14: the updater against a local fake GitHub, with a throwaway signing key, on Tauri's mock runtime.
remotely-core = { workspace = true, features = ["fakes"] }
tauri = { version = "2.12", features = ["test"] }
