[package]
name = "remotely"
description = "Remotely desktop shell (Tauri 2)"
# Release version: keep in step with package.json and tauri.conf.json (see CLAUDE.md).
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "remotely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
remotely-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tauri = { version = "2", features = [] }
