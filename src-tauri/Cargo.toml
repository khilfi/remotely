[package]
name = "remotely"
description = "Remotely desktop shell (Tauri 2)"
# Release version: keep in step with package.json and tauri.conf.json (see CLAUDE.md).
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "remotely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
remotely-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# Zeroes a key file's bytes when they are not text (SS-04).
zeroize = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2"
# FD-14: the GitHub API asset URLs the updater fetches from.
url = "2"
# AP-05: the save dialog for audit exports, opened from Rust so the UI never picks a path itself.
tauri-plugin-dialog = "2"
# QL-05: right-click paste reads the clipboard's text here, so WebView2 never asks for clipboard permission.
arboard = { version = "3", default-features = false }

[dev-dependencies]
# FD-14: the updater against a local fake GitHub, with a throwaway signing key, on Tauri's mock runtime.
remotely-core = { workspace = true, features = ["fakes"] }
tauri = { version = "2.12", features = ["test"] }
