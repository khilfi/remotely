# cargo-deny: ci.yml's dependency scan runs `cargo deny --locked check advisories bans sources` on every
# pull request and every merge to main (C4). Docs: https://embarkstudios.github.io/cargo-deny/
#
# Run it locally with the same command (cargo-deny is not a project dependency: `cargo install
# --locked cargo-deny`, or the release binary from github.com/EmbarkStudios/cargo-deny).

[graph]
# Only the platform Remotely ships for: crates only Linux or macOS builds use (GTK, WebKitGTK,
# Cocoa...) are never compiled into the app, so their advisories don't apply.
targets = ["x86_64-pc-windows-msvc"]
# The `fakes` feature too: its crates build into every test run.
all-features = true

[advisories]
# A security advisory for any crate in Cargo.lock fails the scan, unless it is listed below with a
# reason. Unmaintained crates fail it only when the workspace depends on them directly; Tauri's own
# dependencies are Tauri's to replace, and a Tauri update brings the fix.
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # rsa (Marvin attack: RSA decryption timing). Remotely only signs with RSA (SSH user keys, SS-09)
  # and never decrypts with it, and no rsa release fixes it yet. Revisit when one does.
  { id = "RUSTSEC-2023-0071", reason = "rsa timing side channel affects decryption; Remotely only signs" },
  # libsqlite3-sys (SQLite CVE-2026-119375: a crafted database and `-wal` pair with different page sizes
  # returns uninitialized page-cache memory). Remotely opens only its own database, remotely.db in this
  # user's app data folder, which only this user (and administrators) can write, and which the quick file
  # server never writes into. Whoever could plant a `-wal` there can already read the app's memory. The fix
  # is in libsqlite3-sys 0.39, but sqlx-sqlite 0.9.0 takes only < 0.38. Revisit when sqlx allows 0.39.
  { id = "RUSTSEC-2026-0459", reason = "SQLite WAL page-size bug needs a crafted file; Remotely opens only its own database" },
  # russh (the agent server signs with confirm-constrained keys without asking `Agent::confirm`). Remotely
  # is an agent client only: the Windows OpenSSH agent or Pageant holds the keys and signs, not russh. It
  # never forwards an agent. russh's agent server runs only in the `fakes` test agent, with no constrained
  # keys. The fix is in russh 0.65, a breaking release: drop this entry when Remotely moves to it.
  { id = "RUSTSEC-2026-0495", reason = "russh agent server bug; Remotely only uses the agent client, the server is test-only" },
]

[bans]
# Several versions of one crate only warn. The crypto ones below are known: russh, ssh-key and rsa
# (SSH, SS-03 and SS-09) and the vault's aes-gcm and argon2 (SS-04) are on RustCrypto's new
# releases (digest 0.11, sha2 0.11, rand_core 0.10), while Tauri, its plugins and rustls still use
# the previous ones. Each side gets the version it was built and tested with; they never mix
# types. They go away as Tauri moves up.
multiple-versions = "warn"
wildcards = "allow"
skip = [
  { crate = "block-buffer", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "cpufeatures", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "crypto-common", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "digest", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "generic-array", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "getrandom", reason = "rand_core 0.6 to 0.10 across Tauri, rustls and russh" },
  { crate = "rand", reason = "rand 0.9 (Tauri, rustls) and 0.10 (russh, ssh-key)" },
  { crate = "rand_core", reason = "rand 0.9 (Tauri, rustls) and 0.10 (russh, ssh-key)" },
  { crate = "sha2", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
  { crate = "sha3", reason = "RustCrypto 0.10 (Tauri) and 0.11 (russh, vault) digests" },
]

[sources]
# Crates come from crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
