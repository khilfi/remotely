# Secret scan for every push to main and every pull request, documentation included: a token pasted into a
# README is exactly what it is for (CLAUDE.md "Public repository rules"). It runs on Linux, which costs a
# fraction of ci.yml's Windows minutes. Third-party actions are pinned to full commit SHAs; the comment
# names the release.

name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI rather than gitleaks-action, which only scans the pushed commits.
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1 .
