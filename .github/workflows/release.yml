# Release: push a tag vX.Y.Z (CLAUDE.md "Releases and auto-update"). Two jobs, so the update-signing key
# never meets the build (C1):
#
# 1. build (Windows; no secrets, a read-only token): checks that the tagged commit is on main and that the
#    tag matches the three version files, builds the NSIS installer with the pinned Node and Rust and
#    --locked, and hands it to the next job as a workflow artifact. npm's and the ~660 crates' build
#    scripts run here, where there is no key to take.
# 2. publish (Linux; Environment `release`): waits for the owner's approval, signs the installer with
#    `tauri signer sign`, checks the signature, then creates the DRAFT release with the installer, its .sig
#    and latest.json (scripts/publish-release.mjs checks latest.json as installed apps read it, and deletes
#    the draft if anything fails). Only this job can read the signing key (Environment secrets) and write
#    releases.
#
# Publish the draft after a smoke test; installed apps only see published releases. README "Release" has
# the owner's settings this relies on. Third-party actions are pinned to full commit SHAs; the comment names
# the release.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One run per tag at a time: a second push of the same tag waits instead of racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the installer (no secrets)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.installer.outputs.name }}
      sha256: ${{ steps.installer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches and history, to check that the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$(git rev-parse --short HEAD), tagged ${GITHUB_REF_NAME}, is not on main. Push main first, and tag a commit main contains."
            exit 1
          fi

      - name: Check the tag matches the version in all three files
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $want = $env:TAG.TrimStart("v")
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($npm -ne $want -or $conf -ne $want -or $cargo -ne $want) {
            Write-Error "Tag $env:TAG does not match package.json ($npm), tauri.conf.json ($conf) and src-tauri/Cargo.toml ($cargo)"
            exit 1
          }
          "version=$want" >> $env:GITHUB_OUTPUT

      - name: Refuse to release without the update-signing public key
        shell: pwsh
        run: |
          if (Select-String -Path src-tauri/tauri.conf.json -Pattern 'REPLACE_WITH_UPDATE_SIGNING_PUBLIC_KEY' -Quiet) {
            Write-Error "plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder; installed apps could not verify this release"
            exit 1
          }

      # No npm or Rust cache: a release builds from nothing an earlier run left behind (C5).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The version, profile and components in rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version

      - run: npm ci

      # bundle.createUpdaterArtifacts is off in tauri.conf.json, so the build signs nothing and needs no
      # key: the publish job signs the installer. `-- --locked` reaches cargo: Cargo.lock as committed.
      - name: Build the NSIS installer
        shell: bash
        run: npm run tauri -- build --ci --bundles nsis -- --locked

      - name: Find the installer
        id: installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(node -p 'require("./src-tauri/tauri.conf.json").productName')_${VERSION}_x64-setup.exe"
          for dir in target/release/bundle/nsis src-tauri/target/release/bundle/nsis; do
            if [ -f "$dir/$name" ]; then path="$dir/$name"; fi
          done
          if [ -z "${path:-}" ]; then
            echo "::error::$name was not built"
            exit 1
          fi
          if ls "$(dirname "$path")"/*.sig >/dev/null 2>&1; then
            echo "::error::the build signed the installer, so it had a signing key: it must have none"
            exit 1
          fi
          sha256="$(sha256sum "$path" | cut -d ' ' -f 1)"
          echo "$name: sha256 $sha256"
          {
            echo "name=$name"
            echo "path=$path"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          # The publish job waits for the owner's approval; a week leaves time for that.
          retention-days: 7
          compression-level: 0

  publish:
    name: Sign, check and draft the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected: the owner approves each run, and only v* tags may use it. It holds the signing key as
    # Environment secrets, so no other job or branch can read it.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # The installer lands in $RUNNER_TEMP/release, the notes in $RUNNER_TEMP/release-notes.md.
      INSTALLER_NAME: ${{ needs.build.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The Tauri CLI at the version package-lock.json pins, checked against its integrity hash. No
      # install scripts run, so the CLI is the only npm package that ever runs in this job.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/release

      - name: Check it is the installer the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${SHA256}  ${RUNNER_TEMP}/release/${INSTALLER_NAME}" | sha256sum --check -

      # The release notes are the annotated tag's message (`git tag -a vX.Y.Z -m "notes"`). They also go
      # into latest.json, which installed apps show in their update banner (FD-14). They go to a file, not
      # to $GITHUB_OUTPUT, so no line of the message can end a heredoc early (C15).
      - name: Release notes from the tag message
        env:
          TAG: ${{ github.ref_name }}
          # Read the tag through the API with the workflow's token: the checkout keeps no credentials.
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          : > "$notes"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.type)" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .message > "$notes"
          fi

      # The only step that sees the key. --app-version writes the version into the signature's trusted
      # comment, which installed apps check against latest.json before they offer the update (C3).
      - name: Sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the release Environment has no TAURI_SIGNING_PRIVATE_KEY secret (README \"Release\")"
            exit 1
          fi
          npx --no-install tauri signer sign --app-version "$VERSION" "${RUNNER_TEMP}/release/${INSTALLER_NAME}"

      # C6: before any release exists, the signature must check out against plugins.updater.pubkey and
      # name this installer and version. If it fails, the key in the secrets does not pair with the public
      # key installed apps trust.
      - name: Check the signature against the app's public key
        run: node scripts/verify-update-signature.mjs --version "$VERSION" "${RUNNER_TEMP}/release/${INSTALLER_NAME}.sig"

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/publish-release.mjs --tag "$TAG" \
            --installer "${RUNNER_TEMP}/release/${INSTALLER_NAME}" --notes "${RUNNER_TEMP}/release-notes.md"
